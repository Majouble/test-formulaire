<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="../commun/socle.js"></script>
<script src="../commun/geo.js"></script>
<link rel="stylesheet" href="tableau.css">
<style>
  body { margin: 0; }
  #tdb-message { font: 14px/1.45 system-ui, sans-serif; margin: 16px; padding: 12px 16px; border-radius: 8px; background: #e8edff; color: #000091; }
</style>
</head>
<body>
<p id="tdb-message" hidden></p>
<div id="tableau-de-bord"></div>
<script src="tableau.js"></script>
<script>
/* Widget du tableau de bord (v2) : affiche la version publiée dans l'administration (clé tableau_de_bord de Config).
   Les données sont celles de la table à laquelle le widget est relié (normalement la table des réponses). */
(async () => {
  grist.ready({ requiredAccess: "full", allowSelectBy: true });
  const msg = t => { const p = document.getElementById("tdb-message"); p.textContent = t; p.hidden = !t; };
  const lirePublie = async () => {
    const c = await window.Socle.lireConfig();
    return c && c.valeurs.tableau_de_bord && c.valeurs.tableau_de_bord.publie;
  };
  let publie = null;
  try { publie = await lirePublie(); } catch (e) { msg(`Configuration illisible : ${e.message || e}`); return; }
  if (!publie) { msg("Aucun tableau de bord publié : réglez-le dans l'administration (onglet Tableau de bord), puis « Publier »."); return; }
  let table = null;
  try { table = await grist.getTable().getTableId(); } catch (_) {}
  const tdb = window.TableauDeBord.monter(document.getElementById("tableau-de-bord"), {
    mode: "lecture", table,
    abonner: cb => grist.onRecords(rows => cb(rows), { includeColumns: "normal" }),
    configuration: () => publie,
  });
  // nouvelle publication : prise en compte sans recharger la page
  setInterval(async () => {
    try { const p = await lirePublie(); if (p && JSON.stringify(p) !== JSON.stringify(publie)) { publie = p; tdb.remplacer(p); } } catch (_) {}
  }, 60000);
})();
</script>
</body>
</html>
