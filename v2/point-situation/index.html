<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point de situation</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="../commun/theme.js"></script>
<script src="../commun/socle.js"></script>
<script src="../commun/point-moteur.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pizzip@3.3.0/dist/pizzip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.71.0/build/docxtemplater.js"></script>
<style>
  :root { --bleu: #000091; --fond: #f4f4f4; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Marianne, Arial, sans-serif; font-size: 13px; background: var(--fond); color: var(--x-161616); }
  .barre { position: sticky; top: 0; z-index: 2; background: var(--x-ffffff); border-bottom: 1px solid var(--x-dddddd); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: end; }
  .barre label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--x-555555); }
  input, select, textarea { font: inherit; padding: 3px 5px; border: 1px solid var(--x-bbbbbb); border-radius: 3px; }
  .barre input[type=number] { width: 60px; }
  button { font: inherit; padding: 5px 10px; border: 1px solid var(--bleu); background: var(--x-ffffff); color: var(--bleu); border-radius: 3px; cursor: pointer; }
  button.principal { background: var(--bleu); color: var(--x-ffffff); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--x-0a76f6); outline-offset: 1px; }
  #etat { font-size: 12px; color: var(--x-555555); flex-basis: 100%; white-space: pre-line; }
  #etat.erreur { color: var(--x-ce0500); }
  #etat.alerte { color: var(--x-b34000); }
  .page { background: #fff; color: #161616; width: 210mm; max-width: calc(100% - 24px); margin: 12px auto; padding: 12mm 10mm; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .entete { display: grid; grid-template-columns: 1fr 1.2fr 1.6fr 1fr; gap: 8px; align-items: center; margin-bottom: 14px; font-weight: bold; text-align: center; }
  .entete .logo { text-align: left; font-size: 10px; line-height: 1.2; }
  .entete .bandeau { background: #4472C4; color: #fff; padding: 12px 6px; }
  .entete .cmc { text-align: left; border-left: 3px solid #000; padding-left: 6px; }
  h1 { font-size: 13px; text-align: center; margin: 8px 0; }
  h2 { font-size: 14px; font-weight: normal; border-bottom: 2px solid var(--bleu); margin: 18px 0 8px 40px; padding-bottom: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 11.5px; table-layout: fixed; }
  th { text-align: left; padding: 8px 5px; border: 1px solid #000; }
  td { border: 1px solid #000; padding: 3px 5px; vertical-align: top; overflow-wrap: anywhere; }
  mark { background: #ffff00; }
  .vide { font-style: italic; color: #555; margin: 4px 0; }
  #reglages { display: none; background: var(--x-ffffff); margin: 12px; padding: 12px; border: 1px solid var(--x-cccccc); }
  #reglages.ouvert { display: block; }
  #reglages fieldset { border: 1px solid var(--x-dddddd); margin: 0 0 10px; }
  #reglages .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 12px; }
  #reglages label { display: flex; flex-direction: column; font-size: 11px; color: var(--x-555555); }
  #reglages label.large { grid-column: 1 / -1; }
  .aide { font-size: 11.5px; color: var(--x-555555); line-height: 1.45; }
  .aide code { background: var(--x-eeeeee); padding: 0 3px; }
  #champs { max-height: 180px; overflow: auto; font-family: monospace; font-size: 11.5px; background: var(--x-fafafa); border: 1px solid var(--x-dddddd); padding: 6px; }

  /* Thème clair / sombre (commun/theme.js) : couleurs des règles, valeurs sombres déduites des claires */
  :root { --x-0a76f6: #0a76f6; --x-161616: #161616; --x-555555: #555555; --x-b34000: #b34000; --x-bbbbbb: #bbbbbb; --x-cccccc: #cccccc; --x-ce0500: #ce0500; --x-dddddd: #dddddd; --x-eeeeee: #eeeeee; --x-fafafa: #fafafa; --x-ffffff: #ffffff; }
  :root[data-theme="dark"] { --x-0a76f6: #365a84; --x-161616: #cecece; --x-555555: #bebebe; --x-b34000: #fc8a4a; --x-bbbbbb: #3c3c3c; --x-cccccc: #333333; --x-ce0500: #ff5655; --x-dddddd: #353535; --x-eeeeee: #2c2c2c; --x-fafafa: #242424; --x-ffffff: #1e1e1e; }
  :root[data-theme="dark"] { --bleu: #8585f6; --fond: #161616; }
</style>
</head>
<body>
<div class="barre" role="toolbar" aria-label="Paramètres du point de situation">
  <label>Signalements depuis <input type="datetime-local" id="depuis"></label>
  <label>Marquer « nouveau » après <input type="datetime-local" id="dernierPoint"></label>
  <label>Heure du point <input type="datetime-local" id="maintenant"></label>
  <label>N° <input type="number" id="numero" min="1"></label>
  <label>Académie <select id="academie"><option value="">Toutes</option></select></label>
  <button id="actualiser">Actualiser</button>
  <button id="telecharger" class="principal" disabled>Télécharger le .docx</button>
  <button id="copierWord" disabled title="Copie les tableaux avec le gras et le surlignage, à coller dans Word">Copier pour Word</button>
  <button id="enregistrer" title="Enregistre l'heure et le numéro de ce point dans la table Points_situation">Enregistrer ce point</button>
  <button id="btnReglages" aria-expanded="false" aria-controls="reglages">⚙ Réglages</button>
  <div id="etat" role="status" aria-live="polite">Chargement…</div>
</div>

<div id="reglages">
  <fieldset><legend>Réglages</legend>
    <p class="aide">Les tableaux, colonnes, tris et l'en-tête de ce point de situation se règlent dans l'<b>administration</b>, onglet <b>Point de situation</b>, puis « Publier ». Ce widget applique la version publiée.</p>
    <p class="aide" id="infoConfig"></p>
    <label>Modèle Word pour cette session (facultatif) <input type="file" id="modeleFichier" accept=".docx"></label>
    <details><summary>Champs disponibles</summary><div id="champs"></div></details>
    <button id="creerTables" hidden></button><button id="sauverReglages" hidden></button>
  </fieldset>
</div>
<main id="apercu" aria-label="Aperçu du point de situation"></main>

<script>
/* ======================= widget Grist ======================= */
const $ = id => document.getElementById(id);
const etat = (t, cls) => { $("etat").textContent = t; $("etat").className = cls || ""; };
const enLocal = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
let options = {}, modeleLocal = null, point = null;
const TABLE_REGLAGES = "Parametres", COL_REGLAGES = "Reglages_point_situation";

let source = creerSource();

async function listeTables() { return grist.docApi.listTables(); }
let psPublie = null, psInfo = "";
const CFG_PS = { Colonnes_point: "colonnes", Sections_point: "sections", Tri_point: "tri" };
async function lireConfigTable(nom) {
  if (psPublie && CFG_PS[nom] && Array.isArray(psPublie[CFG_PS[nom]]))
    return psPublie[CFG_PS[nom]].map((r, i) => ({ ...r, Ordre: i + 1, Actif: r.Actif !== false }));
  if (!(await listeTables()).includes(nom)) return null;
  return (await source.table(nom)).lignes;
}

// ---------- réglages (table Parametres, pour ne pas écraser le code du Custom Widget Builder)
async function lireReglages() {
  // v2 : configuration publiée dans Config ; réglages techniques par défaut déduits du socle (table, colonnes)
  let defauts = {};
  try {
    const meta = await window.Socle.lireMeta(), config = await window.Socle.lireConfig(meta);
    defauts = await window.Socle.reglagesPointParDefaut(meta, config);
    const ps = config && config.valeurs.point_situation;
    if (ps && ps.publie) {
      psPublie = ps.publie;
      psInfo = `Configuration publiée le ${ps.publie_le ? new Date(ps.publie_le * 1000).toLocaleString("fr-FR") : "?"}.`;
      const o = { ...defauts };
      for (const [k, v] of Object.entries(ps.publie.options || {})) if (v !== "" && v != null) o[k] = v;
      return o;
    }
    if (config) psInfo = "Aucune configuration publiée : réglages par défaut (ou anciennes tables Colonnes_point, Sections_point, Tri_point).";
  } catch (e) { console.warn(e); }
  try {
    if (!(await listeTables()).includes(TABLE_REGLAGES)) return defauts;
    const t = await grist.docApi.fetchTable(TABLE_REGLAGES);
    const v = (t[COL_REGLAGES] || []).find(x => x && String(x).trim());
    return { ...defauts, ...(v ? JSON.parse(v) : {}) };
  } catch (e) { console.warn(e); return defauts; }
}
async function sauverReglages(nv) {
  const json = JSON.stringify(nv), acts = [], tables = await listeTables();
  if (!tables.includes(TABLE_REGLAGES)) {
    acts.push(["AddTable", TABLE_REGLAGES, [{ id: COL_REGLAGES, type: "Text" }]], ["AddRecord", TABLE_REGLAGES, null, { [COL_REGLAGES]: json }]);
  } else {
    const t = await grist.docApi.fetchTable(TABLE_REGLAGES);
    if (!(COL_REGLAGES in t)) acts.push(["AddColumn", TABLE_REGLAGES, COL_REGLAGES, { type: "Text" }]);
    acts.push(t.id.length ? ["UpdateRecord", TABLE_REGLAGES, t.id[0], { [COL_REGLAGES]: json }] : ["AddRecord", TABLE_REGLAGES, null, { [COL_REGLAGES]: json }]);
  }
  await grist.docApi.applyUserActions(acts);
}
$("btnReglages").onclick = () => {
  const o = $("reglages").classList.toggle("ouvert"); $("btnReglages").setAttribute("aria-expanded", o);
  if (o) { $("infoConfig").textContent = `${psInfo} Version ${window.Socle.VERSION}.`; afficherChamps(); }
};
$("sauverReglages").onclick = async () => {
  const nv = {}; document.querySelectorAll("[data-opt]").forEach(i => { if (i.value.trim()) nv[i.dataset.opt] = i.value.trim(); });
  try { await sauverReglages(nv); options = nv; $("reglages").classList.remove("ouvert"); $("btnReglages").setAttribute("aria-expanded", "false"); charger(); }
  catch (e) { etat("Enregistrement des réglages impossible : " + (e.message || e), "erreur"); }
};
$("modeleFichier").onchange = async e => { const f = e.target.files[0]; if (f) { modeleLocal = await f.arrayBuffer(); etat("Modèle chargé : « " + f.name + " »."); } };

// ---------- tables de configuration
$("creerTables").onclick = async () => {
  try {
    const tables = await listeTables(), acts = [];
    const cols = (await lireConfigTable("Colonnes_point")) || DEFAUT_COLONNES, secs = (await lireConfigTable("Sections_point")) || DEFAUT_SECTIONS;
    if (!tables.includes("Colonnes_point")) {
      acts.push(["AddTable", "Colonnes_point", [{ id: "Ordre", type: "Numeric" }, { id: "Titre", type: "Text" }, { id: "Contenu", type: "Text" }, { id: "Largeur", type: "Numeric" },
        { id: "Couleur", type: "Text" }, { id: "Fusionner", type: "Bool" }, { id: "Tableaux", type: "Text" }, { id: "Actif", type: "Bool" }]]);
      acts.push(["BulkAddRecord", "Colonnes_point", cols.map(() => null), ["Ordre", "Titre", "Contenu", "Largeur", "Couleur", "Fusionner", "Tableaux", "Actif"].reduce((o, k) => (o[k] = cols.map(c => c[k] ?? null), o), {})]);
    }
    if (!tables.includes("Sections_point")) {
      acts.push(["AddTable", "Sections_point", [{ id: "Ordre", type: "Numeric" }, { id: "Titre", type: "Text" }, { id: "Condition", type: "Text" }, { id: "Actif", type: "Bool" }]]);
      acts.push(["BulkAddRecord", "Sections_point", secs.map(() => null), ["Ordre", "Titre", "Condition", "Actif"].reduce((o, k) => (o[k] = secs.map(c => c[k] ?? null), o), {})]);
    }
    if (!tables.includes("Tri_point")) {
      const regles = lireRegles(options.tri || DEFAUT_TRI);
      acts.push(["AddTable", "Tri_point", [{ id: "Ordre", type: "Numeric" }, { id: "Champ", type: "Text" },
        { id: "Sens", type: "Choice", widgetOptions: JSON.stringify({ choices: ["A→Z", "Z→A", "Liste", "Ordre des choix"] }) }, { id: "Valeurs", type: "Text" }, { id: "Actif", type: "Bool" }]]);
      acts.push(["BulkAddRecord", "Tri_point", regles.map(() => null), {
        Ordre: regles.map((r, i) => i + 1), Champ: regles.map(r => r.c),
        Sens: regles.map(r => r.choix ? "Ordre des choix" : r.valeurs ? "Liste" : r.desc ? "Z→A" : "A→Z"),
        Valeurs: regles.map(r => r.valeurs ? r.valeurs.join("\n") : ""), Actif: regles.map(() => true) }]);
    }
    if (!acts.length) { etat("Les tables Colonnes_point, Sections_point et Tri_point existent déjà."); return; }
    await grist.docApi.applyUserActions(acts);
    etat("Tables créées : ajoutez une page pour les modifier, puis « Actualiser »."); charger();
  } catch (e) { etat("Création impossible : " + (e.message || e), "erreur"); }
};
async function afficherChamps() {
  try {
    const nomT = options.table || "Reponses", ty = await source.types(nomT), lignes = [];
    for (const [c, t] of Object.entries(ty)) {
      if (c.startsWith("gristHelper") || c === "manualSort") continue;
      lignes.push(`${c}  (${t})`);
      const cible = (t.match(/^Ref(?:List)?:(.+)$/) || [])[1];
      if (cible) for (const [c2, t2] of Object.entries(await source.types(cible))) if (!c2.startsWith("gristHelper") && c2 !== "manualSort") lignes.push(`${c}.${c2}  (${t2})`);
    }
    $("champs").textContent = lignes.join("\n");
    $("champs").style.whiteSpace = "pre";
  } catch (e) { $("champs").textContent = "Table introuvable : " + (options.table || "Reponses"); }
}

// ---------- points déjà enregistrés
let initialise = false;
async function initialiser() {
  if (initialise) return; initialise = true;
  const debut = new Date(); debut.setHours(0, 0, 0, 0);
  $("depuis").value = enLocal(debut); $("dernierPoint").value = enLocal(debut); $("maintenant").value = enLocal(new Date()); $("numero").value = 1;
  try {
    const pts = await lireConfigTable("Points_situation");
    const p = (pts || []).filter(r => r.Horodatage instanceof Date).sort((a, b) => b.Horodatage - a.Horodatage)[0];
    if (p) { $("numero").value = (Number(p.Numero) || 0) + 1; $("dernierPoint").value = enLocal(p.Horodatage); }
  } catch (e) { /* pas encore de point enregistré */ }
}

// ---------- assemblage et aperçu
async function charger() {
  try {
    etat("Assemblage…");
    source = creerSource();
    await initialiser();
    await calculer(true);
  } catch (e) { console.error(e); etat("Erreur : " + (e.message || e) + " — vérifiez ⚙ Réglages.", "erreur"); }
}
async function calculer(majAcademies) {
  const cfg = {
    reglages: { ...options, depuis: $("depuis").value ? new Date($("depuis").value) : null, dernierPoint: $("dernierPoint").value ? new Date($("dernierPoint").value) : null, academie: $("academie").value },
    colonnes: await lireConfigTable("Colonnes_point"), sections: await lireConfigTable("Sections_point"), tri: await lireConfigTable("Tri_point"),
  };
  if (majAcademies) {
    // liste des académies présentes (sans filtre)
    const tout = await assemblerPoint(source, { ...cfg, reglages: { ...cfg.reglages, academie: "" }, sections: [{ Titre: "t", Condition: "", Actif: true }], colonnes: [{ Titre: "a", Contenu: `{${options.champAcademie || "Etablissement.Academie"}}`, Actif: true }] });
    const acas = [...new Set(tout.sections[0].rows.map(r => r[0]).filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr"));
    const sel = $("academie"), garde = sel.value;
    sel.innerHTML = '<option value="">Toutes</option>' + acas.map(a => `<option>${echap(a)}</option>`).join("");
    sel.value = acas.includes(garde) ? garde : ""; cfg.reglages.academie = sel.value;
  }
  point = await assemblerPoint(source, cfg);
  const e = entete();
  $("apercu").innerHTML = `<article class="page"><div class="entete"><div class="logo">MINISTÈRE<br>DE L'ÉDUCATION<br>NATIONALE</div>
    <div class="bandeau">${echap(e.bandeau)}<br>${echap(e.perimetre_court)}</div>
    <div>Point de situation n°${echap(e.numero)}<br>${echap(e.date_longue)}<br>Actualisation à ${echap(e.heure)}</div><div class="cmc">Centre ministériel de crise</div></div>
    <h1>ESSENTIEL ${echap(e.perimetre_long)}</h1>${sectionsHTML(point)}<h2>${point.sections.length + 1}. Veille DELCOM</h2><p>A compléter.</p></article>`;
  $("telecharger").disabled = false; $("copierWord").disabled = false;
  const msgs = [`${point.nb} dossier(s) : ${point.sections.map(s => `${s.titre} ${s.rows.length}`).join(", ")}.`];
  if (point.horsSection) msgs.push(`${point.horsSection} dossier(s) n'entrent dans aucun tableau : ajoutez une section sans condition pour les afficher.`);
  if (point.manquants.length) msgs.push("Champs introuvables : " + point.manquants.join(", ") + " (voir ⚙ Réglages › Champs disponibles).");
  if (!cfg.colonnes) msgs.push("Configuration par défaut : réglez le point de situation dans l'administration (onglet Point de situation), puis publiez.");
  etat(msgs.join("\n"), point.manquants.length || point.horsSection ? "alerte" : "");
}
function entete() {
  const n = $("maintenant").value ? new Date($("maintenant").value) : new Date(), aca = $("academie").value;
  return {
    bandeau: options.bandeau || "Mouvements sociaux", perimetre_court: options.perimetre_court || "EN",
    perimetre_long: (options.perimetre_long || "ENSEIGNEMENT SUPÉRIEUR") + (aca ? " – ACADÉMIE DE " + aca.toUpperCase() : ""),
    numero: $("numero").value || "",
    date_longue: n.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }),
    heure: n.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }).replace(":", "h"),
  };
}
["depuis", "dernierPoint", "academie"].forEach(id => $(id).addEventListener("change", () => calculer(false).catch(e => etat("Erreur : " + e.message, "erreur"))));
["maintenant", "numero"].forEach(id => $(id).addEventListener("change", () => calculer(false)));
$("actualiser").onclick = () => { $("maintenant").value = enLocal(new Date()); charger(); };

// ---------- document Word
async function modele() {
  if (modeleLocal) return modeleLocal;
  const nomT = options.modeleTable || "Parametres", col = options.modeleColonne || "Modele_point_situation";
  const lignes = await lireConfigTable(nomT);
  const pj = lignes && lignes.map(r => r[col]).find(v => Array.isArray(v) && v.length);
  if (!pj) throw new Error(`aucun modèle dans ${nomT}.${col} : ajoutez-le en pièce jointe, ou chargez un fichier dans ⚙ Réglages`);
  const jeton = await grist.docApi.getAccessToken({ readOnly: true });
  const rep = await fetch(`${jeton.baseUrl}/attachments/${pj[0]}/download?auth=${jeton.token}`);
  if (!rep.ok) throw new Error("téléchargement du modèle impossible (" + rep.status + ")");
  return rep.arrayBuffer();
}
$("telecharger").onclick = async () => {
  try {
    etat("Préparation du document…");
    const zip = new PizZip(await modele());
    const styleTitre = ((zip.file("word/styles.xml") || { asText: () => "" }).asText().match(/<w:style [^>]*w:styleId="(Titre1|Heading1)"/) || [, "Titre1"])[1];
    const doc = new docxtemplater(zip, { paragraphLoop: true, linebreaks: true });
    doc.render({ ...entete(), corps: sectionsXML(point, styleTitre) });
    const blob = doc.getZip().generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
    const n = new Date($("maintenant").value || Date.now()), p2 = x => String(x).padStart(2, "0");
    const nom = `${n.getFullYear()}_${p2(n.getMonth() + 1)}_${p2(n.getDate())}_Point_de_situation_n${p2($("numero").value || 0)}${$("academie").value ? "_" + $("academie").value : ""}.docx`;
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nom; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    etat("Document généré : " + nom);
  } catch (e) {
    console.error(e);
    const det = e.properties && e.properties.errors ? e.properties.errors.map(x => x.properties.explanation).join(" ; ") : (e.message || e);
    etat("Erreur : " + det, "erreur");
  }
};
$("enregistrer").onclick = async () => {
  try {
    const acts = [];
    if (!(await listeTables()).includes("Points_situation")) acts.push(["AddTable", "Points_situation", [
      { id: "Horodatage", type: "DateTime:Europe/Paris" }, { id: "Numero", type: "Int" }, { id: "Academie", type: "Text" }, { id: "Nb_dossiers", type: "Int" }]]);
    acts.push(["AddRecord", "Points_situation", null, { Horodatage: new Date($("maintenant").value || Date.now()).getTime() / 1000,
      Numero: Number($("numero").value) || null, Academie: $("academie").value, Nb_dossiers: point ? point.nb : null }]);
    await grist.docApi.applyUserActions(acts);
    etat(`Point n°${$("numero").value} enregistré.`);
    $("dernierPoint").value = $("maintenant").value; $("numero").value = (Number($("numero").value) || 0) + 1;
    calculer(false);
  } catch (e) { etat("Erreur à l'enregistrement : " + (e.message || e), "erreur"); }
};

/* ---------- Copier-coller vers Word ----------
   Word ne reconnaît pas le surlignage d'une page web (<mark>, fond CSS) : il faut lui fournir un HTML
   « à la Word », avec mso-highlight pour le surlignage et des styles écrits sur chaque cellule.
   Le navigateur supprime mso-highlight s'il copie lui-même la sélection : on écrit donc le presse-papiers
   nous-mêmes, dans l'événement « copy » (fonctionne aussi dans le cadre du widget, sans autorisation). */
const STYLE_CELLULE = "border:1px solid #000;padding:2pt 4pt;vertical-align:top;font-family:Marianne,Arial,sans-serif;font-size:9pt";
function htmlPourWord(fragment) {
  const div = document.createElement("div");
  div.appendChild(fragment);
  div.querySelectorAll("mark").forEach(m => {
    const s = document.createElement("span");
    s.setAttribute("style", "background-color:#FFFF00;mso-highlight:yellow");
    s.innerHTML = m.innerHTML; m.replaceWith(s);
  });
  div.querySelectorAll("strong").forEach(b => { const n = document.createElement("b"); n.innerHTML = b.innerHTML; b.replaceWith(n); });
  div.querySelectorAll("table").forEach(t => t.setAttribute("style", "border-collapse:collapse;width:100%;table-layout:fixed"));
  div.querySelectorAll("td").forEach(c => c.setAttribute("style", STYLE_CELLULE));
  div.querySelectorAll("th").forEach(c => c.setAttribute("style", `${STYLE_CELLULE};font-weight:bold;${c.getAttribute("style") || ""}`));
  div.querySelectorAll("h1, h2").forEach(h => h.setAttribute("style", "font-family:Marianne,Arial,sans-serif;font-size:12pt;font-weight:normal;border-bottom:1.5pt solid #000091;margin:12pt 0 6pt"));
  div.querySelectorAll("p, li, div").forEach(p => { if (!p.getAttribute("style")) p.setAttribute("style", "font-family:Marianne,Arial,sans-serif;font-size:10pt"); });
  return div.innerHTML;
}
let copieForcee = null;   // contenu à copier par le bouton, sinon la sélection
document.addEventListener("copy", ev => {
  let frag = null, texte = "";
  if (copieForcee) { frag = copieForcee.cloneNode(true); texte = copieForcee.innerText; }
  else {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const r = sel.getRangeAt(0), ap = $("apercu");
    if (ap.contains(r.commonAncestorContainer)) frag = r.cloneContents();
    else if (r.intersectsNode(ap)) { frag = document.createDocumentFragment(); [...ap.childNodes].forEach(n => frag.appendChild(n.cloneNode(true))); }
    else return;   // copie ordinaire ailleurs dans le widget
    texte = sel.toString();
  }
  ev.clipboardData.setData("text/html", htmlPourWord(frag));
  ev.clipboardData.setData("text/plain", texte);
  ev.preventDefault();
});
$("copierWord").onclick = () => {
  const cible = $("apercu").querySelector(".page");
  if (!cible) return;
  // l'en-tête (logo, bandeau) vient du modèle Word : on ne copie que le titre et les tableaux
  const tmp = document.createElement("div");
  cible.querySelectorAll(":scope > h1, :scope > h2, :scope > table, :scope > p").forEach(n => tmp.appendChild(n.cloneNode(true)));
  copieForcee = tmp;
  let ok = false;
  try { ok = document.execCommand("copy"); } finally { copieForcee = null; }
  etat(ok ? "Point copié : collez-le dans Word (Ctrl+V). Le gras et le surlignage sont conservés." : "Copie impossible dans ce navigateur : utilisez « Télécharger le .docx ».", ok ? "" : "erreur");
};

grist.ready({ requiredAccess: "full", allowSelectBy: false });
lireReglages().then(o => { options = o || {}; charger(); });
